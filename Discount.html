<body>  

  <h1>Disount on Ticket based on Gender and Age</h1>

    <button onclick="
    let age = 55;
    let gender = `Male`;

    if(age < 5){
      alert(`Your get 100% discount.`);
    }
    else if(age < 8 || gender === `Female`){
      alert(`Your get 50% discount.`);
    }
    else if(age > 65){
      alert(`You get 30% discount`);
    }
    else{
      alert(`You get 0% discount`);
    }">Male</button>

    <button onclick="
    age = 55;
    gender = `Female`;

    if(age < 5){
      alert(`Your get 100% discount.`);
    }
    else if(age < 8 || gender === `Female`){
      alert(`Your get 50% discount.`);
    }
    else if(age > 65){
      alert(`You get 30% discount`);
    }
    else{
      alert(`You get 0% discount`);
    }">Female</button>

  
  
</body>
